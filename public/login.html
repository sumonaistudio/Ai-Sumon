<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>লগইন — Suman AI Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg:#0f172a; --fg:#f1f5f9; --card:#1e293b; --muted:#94a3b8; }
  html[data-theme="light"] { --bg:#f8fafc; --fg:#0f172a; --card:#ffffff; --muted:#475569; }
  body { background:var(--bg); color:var(--fg); }
  .card { background:var(--card); }
  .muted { color:var(--muted); }
  input { background:var(--bg); color:var(--fg); border:1px solid var(--muted); }
</style>
</head>
<body class="min-h-screen font-sans">
<header class="max-w-5xl mx-auto flex items-center justify-between px-4 py-4">
  <a href="/" class="text-xl font-bold">🎬 Suman AI Studio</a>
  <div class="flex gap-2">
    <button onclick="setLang('bn')" class="px-3 py-1 rounded-full bg-violet-600 text-white text-sm">বাংলা</button>
    <button onclick="setLang('en')" class="px-3 py-1 rounded-full card text-sm">English</button>
    <button onclick="toggleTheme()" class="px-3 py-1 rounded-full card text-sm" id="themeBtn">☀️ Light</button>
  </div>
</header>
<main class="max-w-md mx-auto px-4 pb-16">
  <div class="card rounded-2xl p-6 mt-6">
    <h2 class="text-2xl font-bold" data-i18n="title">লগইন</h2>
    <p class="muted text-sm mt-1" data-i18n="sub">আপনার অ্যাকাউন্টে ঢুকুন।</p>
    <form id="loginForm" class="mt-5 space-y-4">
      <div><label class="text-sm font-semibold">ইমেইল</label>
        <input id="email" type="email" required class="w-full mt-1 px-3 py-2 rounded-xl" placeholder="you@example.com"></div>
      <div><label class="text-sm font-semibold" data-i18n="pw">পাসওয়ার্ড</label>
        <input id="password" type="password" required class="w-full mt-1 px-3 py-2 rounded-xl" placeholder="••••••••"></div>
      <p id="msg" class="text-sm hidden"></p>
      <button class="w-full px-6 py-3 rounded-full bg-violet-600 text-white font-semibold" data-i18n="btn">লগইন করুন</button>
    </form>
    <p class="text-sm mt-4">অ্যাকাউন্ট নেই? <a href="/register.html" class="text-violet-400 underline">রেজিস্টার করুন</a></p>
    <p class="text-sm mt-2"><a href="#" onclick="toggleForgot(event)" class="text-violet-400 underline">পাসওয়ার্ড ভুলে গেছেন?</a></p>
  </div>

  <div id="forgotBox" class="card rounded-2xl p-6 mt-4 hidden">
    <h3 class="font-bold">পাসওয়ার্ড রিসেট</h3>
    <p class="muted text-sm mt-1">ইমেইল দিন — অ্যাকাউন্ট থাকলে রিসেট লিংক পাঠানো হবে।</p>
    <form id="forgotForm" class="mt-4 space-y-3">
      <input id="forgotEmail" type="email" required class="w-full px-3 py-2 rounded-xl" placeholder="you@example.com">
      <p id="forgotMsg" class="text-sm hidden"></p>
      <button class="w-full px-6 py-2 rounded-full bg-violet-600 text-white font-semibold">লিংক পাঠান</button>
    </form>
    <p class="muted text-xs mt-3">ইমেইল (Resend) এখনো সংযুক্ত না থাকলে লিংক পাঠানো যাবে না — সেক্ষেত্রে সার্ভার সেটআপ দেখুন (README)।</p>
  </div>
</main>
<script>
const T = { bn: { title:'লগইন', sub:'আপনার অ্যাকাউন্টে ঢুকুন।', pw:'পাসওয়ার্ড', btn:'লগইন করুন' },
            en: { title:'Log in', sub:'Sign in to your account.', pw:'Password', btn:'Log in' } };
function setLang(l){ document.documentElement.lang=l; document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = T[l][el.dataset.i18n] || el.textContent; }); }
function toggleTheme(){ const h=document.documentElement; const n=h.dataset.theme==='dark'?'light':'dark'; h.dataset.theme=n; localStorage.setItem('sas_theme', n); document.getElementById('themeBtn').textContent = n==='dark' ? '☀️ Light' : '🌙 Dark'; }
(function(){ const t=localStorage.getItem('sas_theme'); if(t){ document.documentElement.dataset.theme=t; document.getElementById('themeBtn').textContent = t==='dark' ? '☀️ Light' : '🌙 Dark'; }
  if(localStorage.getItem('sas_token')) location.href='/dashboard.html'; })();
function show(id, text, ok){ const el=document.getElementById(id); el.classList.remove('hidden'); el.textContent=text; el.style.color = ok ? '#22c55e' : '#f87171'; }
function toggleForgot(e){ e.preventDefault(); document.getElementById('forgotBox').classList.toggle('hidden'); }
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const body = { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value };
  try{
    const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if(!r.ok) return show('msg', d.message || d.error || 'লগইন হয়নি।', false);
    localStorage.setItem('sas_token', d.token);
    show('msg', 'লগইন সফল — ড্যাশবোর্ডে যাচ্ছি…', true);
    setTimeout(()=> location.href='/dashboard.html', 600);
  }catch(err){ show('msg', 'সার্ভারের সাথে সংযোগ হয়নি।', false); }
});
document.getElementById('forgotForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  try{
    const r = await fetch('/api/auth/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: document.getElementById('forgotEmail').value.trim() }) });
    const d = await r.json();
    show('forgotMsg', d.message || 'অনুরোধ পাঠানো হয়েছে।', true);
  }catch(err){ show('forgotMsg', 'সার্ভারের সাথে সংযোগ হয়নি।', false); }
});
</script>
</body>
</html>
