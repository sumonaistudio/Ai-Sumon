<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সাপোর্ট — Suman AI Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg:#0f172a; --fg:#f1f5f9; --card:#1e293b; --muted:#94a3b8; }
  html[data-theme="light"] { --bg:#f8fafc; --fg:#0f172a; --card:#ffffff; --muted:#475569; }
  body { background:var(--bg); color:var(--fg); }
  .card { background:var(--card); }
  .muted { color:var(--muted); }
  input, textarea { background:var(--bg); color:var(--fg); border:1px solid var(--muted); }
  .badge { display:inline-block; padding:2px 8px; border-radius:9999px; font-size:12px; }
</style>
</head>
<body class="min-h-screen font-sans">
<header class="max-w-5xl mx-auto flex items-center justify-between px-4 py-4">
  <a href="/" class="text-xl font-bold">🎬 Suman AI Studio</a>
  <div class="flex gap-2 items-center flex-wrap">
    <a href="/dashboard.html" class="px-3 py-1 rounded-full card text-sm">ড্যাশবোর্ড</a>
    <a href="/gallery.html" class="px-3 py-1 rounded-full card text-sm">গ্যালারি</a>
    <button onclick="toggleTheme()" class="px-3 py-1 rounded-full card text-sm" id="themeBtn">☀️ Light</button>
  </div>
</header>
<main class="max-w-5xl mx-auto px-4 pb-16">
  <h2 class="text-2xl font-bold mt-4">🛟 সাপোর্ট</h2>
  <p class="muted text-sm mt-1">প্রশ্নের উত্তর FAQ-তে খুঁজুন, ঘোষণা দেখুন, অথবা টিকিট খুলুন। টিকিট খুলতে লগইন লাগবে।</p>

  <section class="mt-8">
    <h3 class="text-xl font-bold">📢 ঘোষণা</h3>
    <div id="announcements" class="mt-3 space-y-3 text-sm">⏳ লোড হচ্ছে…</div>
  </section>

  <section class="mt-10">
    <h3 class="text-xl font-bold">❓ সচরাচর জিজ্ঞাসা (FAQ)</h3>
    <div id="faqs" class="mt-3 space-y-3 text-sm">⏳ লোড হচ্ছে…</div>
  </section>

  <section class="mt-10">
    <h3 class="text-xl font-bold">🎫 নতুন টিকিট খুলুন</h3>
    <div id="ticketForm" class="card rounded-2xl p-5 mt-3">
      <input id="ticketTitle" maxlength="200" class="w-full px-3 py-2 rounded-xl" placeholder="শিরোনাম — যেমন: পেমেন্ট অনুমোদন হয়নি">
      <textarea id="ticketMsg" rows="4" class="w-full mt-2 px-3 py-2 rounded-xl" placeholder="আপনার সমস্যাটি বিস্তারিত লিখুন…"></textarea>
      <button onclick="createTicket()" class="mt-3 px-6 py-2 rounded-full bg-violet-600 text-white font-semibold text-sm">টিকিট জমা দিন</button>
      <p id="ticketMsgLine" class="text-sm mt-2 muted"></p>
    </div>
    <p id="loginNote" class="muted text-sm mt-2 hidden">টিকিট খুলতে <a class="text-violet-400 underline" href="/login.html">লগইন করুন</a>।</p>
  </section>

  <section class="mt-10">
    <h3 class="text-xl font-bold">📋 আমার টিকিট</h3>
    <div id="myTickets" class="mt-3 space-y-3 text-sm">⏳ লোড হচ্ছে…</div>
  </section>
</main>
<script>
let token = localStorage.getItem('sas_token');
function toggleTheme(){ const h=document.documentElement; const n=h.dataset.theme==='dark'?'light':'dark'; h.dataset.theme=n; localStorage.setItem('sas_theme', n); document.getElementById('themeBtn').textContent = n==='dark' ? '☀️ Light' : '🌙 Dark'; }
(function(){ const t=localStorage.getItem('sas_theme'); if(t){ document.documentElement.dataset.theme=t; document.getElementById('themeBtn').textContent = t==='dark' ? '☀️ Light' : '🌙 Dark'; } })();
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function authHeaders(){ return { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }; }
function lang(){ return document.documentElement.lang === 'en' ? 'en' : 'bn'; }

async function loadPublic(){
  try{
    const a = await (await fetch('/api/announcements')).json();
    document.getElementById('announcements').innerHTML = (a.announcements || []).length
      ? a.announcements.map(x => `<div class="card rounded-2xl p-4"><b>${esc(lang()==='en' ? x.title_en : x.title_bn)}</b><p class="muted mt-1">${esc(lang()==='en' ? x.body_en : x.body_bn)}</p></div>`).join('')
      : '<p class="muted">এখন কোনো ঘোষণা নেই।</p>';
  }catch(e){ document.getElementById('announcements').textContent='❌ লোড করা যায়নি।'; }
  try{
    const f = await (await fetch('/api/faqs')).json();
    document.getElementById('faqs').innerHTML = (f.faqs || []).length
      ? f.faqs.map(x => `<div class="card rounded-2xl p-4"><b>${esc(lang()==='en' ? x.question_en : x.question_bn)}</b><p class="muted mt-1">${esc(lang()==='en' ? x.answer_en : x.answer_bn)}</p></div>`).join('')
      : '<p class="muted">এখন কোনো FAQ নেই।</p>';
  }catch(e){ document.getElementById('faqs').textContent='❌ লোড করা যায়নি।'; }
}

async function loadTickets(){
  const box = document.getElementById('myTickets');
  if(!token){ box.innerHTML='<p class="muted">আপনার টিকিট দেখতে <a class="text-violet-400 underline" href="/login.html">লগইন করুন</a>।</p>'; document.getElementById('loginNote').classList.remove('hidden'); return; }
  try{
    const r = await fetch('/api/support/tickets', { headers: authHeaders() });
    const d = await r.json();
    if(!r.ok){ box.textContent = d.message || 'টিকিট লোড করা যায়নি।'; return; }
    if(!d.tickets.length){ box.innerHTML='<p class="muted">এখনো কোনো টিকিট খোলেননি।</p>'; return; }
    box.innerHTML = d.tickets.map(t => `<div class="card rounded-2xl p-4">
      <div class="flex justify-between gap-2 flex-wrap"><b>${esc(t.subject)}</b><span class="badge card">${esc(t.status)}</span></div>
      <p class="muted mt-1">${esc(t.message)}</p>
      <div class="flex gap-2 mt-3 items-center flex-wrap">
        <input id="reply-${t.id}" class="px-3 py-1 rounded-full text-sm flex-1 min-w-[200px]" placeholder="উত্তর লিখুন…">
        <button onclick="replyTicket('${t.id}')" class="px-3 py-1 rounded-full bg-violet-600 text-white text-xs">উত্তর পাঠান</button>
        <button onclick="viewReplies('${t.id}')" class="px-3 py-1 rounded-full card text-xs">উত্তর দেখুন</button>
      </div>
      <div id="replies-${t.id}" class="mt-2 space-y-1"></div>
    </div>`).join('');
  }catch(e){ box.textContent='❌ সার্ভারের সাথে সংযোগ হয়নি।'; }
}

async function createTicket(){
  const line = document.getElementById('ticketMsgLine');
  if(!token){ line.textContent='টিকিট খুলতে আগে লগইন করুন।'; return; }
  const title = document.getElementById('ticketTitle').value.trim();
  const message = document.getElementById('ticketMsg').value.trim();
  if(!title || !message){ line.textContent='শিরোনাম ও বার্তা দুটোই লিখুন।'; return; }
  try{
    const r = await fetch('/api/support/tickets', { method:'POST', headers: authHeaders(), body: JSON.stringify({ title, message }) });
    const d = await r.json();
    line.textContent = d.message || d.error || '';
    if(r.ok){ document.getElementById('ticketTitle').value=''; document.getElementById('ticketMsg').value=''; loadTickets(); }
  }catch(e){ line.textContent='সার্ভারের সাথে সংযোগ হয়নি।'; }
}

async function replyTicket(id){
  const input = document.getElementById('reply-' + id);
  const body = input.value.trim();
  if(!body){ alert('উত্তর লিখুন।'); return; }
  try{
    const r = await fetch('/api/support/tickets/' + id + '/replies', { method:'POST', headers: authHeaders(), body: JSON.stringify({ body }) });
    const d = await r.json();
    if(!r.ok){ alert(d.message || 'উত্তর পাঠানো যায়নি।'); return; }
    input.value=''; viewReplies(id); loadTickets();
  }catch(e){ alert('সার্ভারের সাথে সংযোগ হয়নি।'); }
}

async function viewReplies(id){
  const box = document.getElementById('replies-' + id);
  box.textContent='⏳ লোড হচ্ছে…';
  try{
    const r = await fetch('/api/support/tickets/' + id + '/replies', { headers: authHeaders() });
    const d = await r.json();
    if(!r.ok){ box.textContent = d.message || 'উত্তর লোড করা যায়নি।'; return; }
    if(d.replies_not_migrated){ box.innerHTML='<p class="muted text-xs">উত্তর দেখার সুবিধা এখনো চালু হয়নি (সার্ভার মাইগ্রেশন বাকি)।</p>'; return; }
    box.innerHTML = (d.replies || []).length
      ? d.replies.map(x => `<p class="text-xs"><b>${esc(x.author_name || '')} (${esc(x.author_role || '')})</b>: ${esc(x.body)}</p>`).join('')
      : '<p class="muted text-xs">এখনো কোনো উত্তর নেই।</p>';
  }catch(e){ box.textContent='❌ সার্ভারের সাথে সংযোগ হয়নি।'; }
}

loadPublic();
loadTickets();
</script>
</body>
</html>
